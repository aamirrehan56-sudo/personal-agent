<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Personal Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c8cff'/%3E%3Cpath d='M9 22l7-12 7 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <div id="auth" class="auth hidden"></div>

  <div id="shell" class="shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><span class="logo">A</span><span>Personal Agent</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="who" class="muted small"></div>
        <button id="logout" class="btn ghost small">Log out</button>
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button id="menu" class="icon-btn" aria-label="Open menu">☰</button>
        <h1 id="title">Home</h1>
        <div id="clock" class="muted small"></div>
      </header>
      <section id="view" class="view"></section>
    </main>

    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
